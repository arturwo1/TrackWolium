name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: native
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target trackwolium_guard trackwolium_core wolium_setup wolium_uninstall tw_tests
          ctest --test-dir build -C Release --output-on-failure
      - name: ui
        working-directory: ui
        run: |
          flutter create --platforms=windows --project-name wolium .
          python tool\patch_windows.py . ..\assets\icon\wolium.ico
          flutter pub get
          flutter build windows --release
      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item -Recurse ui\build\windows\x64\runner\Release\* stage\
          Copy-Item build\bin\Release\trackwolium.exe stage\
          Copy-Item build\bin\Release\trackwolium-core.exe stage\
          Copy-Item build\bin\Release\uninstall.exe stage\
          python tools\pack_installer.py build\bin\Release\WoliumSetup.exe stage WoliumSetup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: WoliumSetup
          path: WoliumSetup.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: WoliumSetup.exe
