name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - run: python tools/lang.py sync
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: native
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ($v -notmatch '^\d') { $v = '0.18.0' }
          $v = "$v.${{ github.run_number }}"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DTW_VERSION=$v"
          cmake --build build --config Release --target trackwolium_guard trackwolium_core wolium_setup wolium_uninstall tw_tests
          ctest --test-dir build -C Release --output-on-failure
      - name: ui
        working-directory: ui
        run: |
          flutter create --platforms=windows --project-name wolium .
          python tool\patch_windows.py . ..\assets\icon\wolium.ico
          flutter pub get
          flutter build windows --release
      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item -Recurse ui\build\windows\x64\runner\Release\* stage\
          Copy-Item build\bin\Release\trackwolium.exe stage\
          Copy-Item build\bin\Release\trackwolium-core.exe stage\
          Copy-Item build\bin\Release\uninstall.exe stage\
          New-Item -ItemType Directory -Force stage\extensions | Out-Null
          Copy-Item -Recurse extensions\wolium-browser stage\extensions\
          python tools\pack_installer.py build\bin\Release\WoliumSetup.exe stage WoliumSetup.exe
          Set-Content -NoNewline -Path version.txt -Value (Select-String -Path build\CMakeCache.txt -Pattern '^TW_VERSION:[A-Z]+=(.*)$').Matches[0].Groups[1].Value
      - uses: actions/upload-artifact@v6
        with:
          name: WoliumSetup
          path: WoliumSetup.exe
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            WoliumSetup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 tools/lang.py sync
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev clang cmake ninja-build pkg-config libgtk-3-dev libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$v" in
            [0-9]*) VER="$v.${GITHUB_RUN_NUMBER}" ;;
            *) VER="0.18.0.${GITHUB_RUN_NUMBER}" ;;
          esac
          echo "WOLIUM_VERSION=$VER" >> "$GITHUB_ENV"
      - name: build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          (cd ui && flutter create --platforms=linux --project-name wolium . && rm -f test/widget_test.dart && flutter pub get && flutter build linux --release --dart-define=WOLIUM_VERSION=$(v="${GITHUB_REF_NAME#v}"; case "$v" in [0-9]*) echo "$v.${GITHUB_RUN_NUMBER}";; *) echo "0.18.0.${GITHUB_RUN_NUMBER}";; esac))
      - name: package
        run: |
          mkdir -p pkg/wolium-linux/app
          cp -r ui/build/linux/x64/release/bundle/. pkg/wolium-linux/app/
          cp build/bin/trackwolium-core pkg/wolium-linux/app/
          mkdir -p pkg/wolium-linux/app/extensions
          cp -r extensions/wolium-browser pkg/wolium-linux/app/extensions/
          cp tools/linux/install.sh tools/linux/uninstall.sh pkg/wolium-linux/
          cp -r tools/linux/bridge pkg/wolium-linux/bridge
          cp tools/posix/update-check.sh pkg/wolium-linux/app/
          python3 tools/posix/make_strings.py pkg/wolium-linux/app/strings.tsv
          printf '%s' "$WOLIUM_VERSION" > pkg/wolium-linux/app/version.txt
          cp assets/icon/wolium_256.png pkg/wolium-linux/wolium.png
          tar -C pkg -czf Wolium-linux-x86_64.tar.gz wolium-linux
      - uses: actions/upload-artifact@v6
        with:
          name: wolium-linux
          path: Wolium-linux-x86_64.tar.gz
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Wolium-linux-x86_64.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 tools/lang.py sync
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: signing and version
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$v" in
            [0-9]*) VER="$v.${GITHUB_RUN_NUMBER}" ;;
            *) VER="0.18.0.${GITHUB_RUN_NUMBER}" ;;
          esac
          echo "WOLIUM_VERSION=$VER" >> "$GITHUB_ENV"
          echo "WOLIUM_BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/wolium.jks"
            echo "WOLIUM_KEYSTORE=$RUNNER_TEMP/wolium.jks" >> "$GITHUB_ENV"
            echo "WOLIUM_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "WOLIUM_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          fi
      - name: build
        working-directory: ui
        run: |
          pip install pillow
          flutter create --platforms=android --org io.github.arturwo1 --project-name wolium .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py . assets/icon/wolium_256.png
          flutter pub get
          flutter test
          flutter build apk --release --dart-define=WOLIUM_VERSION=$WOLIUM_VERSION
          cp build/app/outputs/flutter-apk/app-release.apk ../Wolium.apk
      - uses: actions/upload-artifact@v6
        with:
          name: wolium-apk
          path: Wolium.apk
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Wolium.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 tools/lang.py sync
      - name: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$v" in
            [0-9]*) VER="$v.${GITHUB_RUN_NUMBER}" ;;
            *) VER="0.18.0.${GITHUB_RUN_NUMBER}" ;;
          esac
          echo "WOLIUM_VERSION=$VER" >> "$GITHUB_ENV"
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: ui
        working-directory: ui
        run: |
          python3 -m pip install --break-system-packages pillow
          flutter create --platforms=macos --org io.github.arturwo1 --project-name wolium .
          rm -f test/widget_test.dart
          python3 tool/patch_macos.py . assets/icon/wolium_256.png
          flutter pub get
          flutter build macos --release --dart-define=WOLIUM_VERSION=$WOLIUM_VERSION
      - name: package
        run: |
          APP="ui/build/macos/Build/Products/Release/Wolium.app"
          MACOS="$APP/Contents/MacOS"
          cp build/bin/trackwolium-core "$MACOS/"
          mkdir -p "$MACOS/extensions"
          cp -R extensions/wolium-browser "$MACOS/extensions/"
          cp tools/posix/update-check.sh "$MACOS/"
          python3 tools/posix/make_strings.py "$MACOS/strings.tsv"
          printf '%s' "$WOLIUM_VERSION" > "$MACOS/version.txt"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $WOLIUM_VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$APP/Contents/Info.plist"
          codesign --force -s - "$MACOS/trackwolium-core"
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" Wolium-macos.zip
          rm -rf dmg
          mkdir -p dmg
          ditto "$APP" dmg/Wolium.app
          ln -s /Applications dmg/Applications
          sudo mdutil -a -i off >/dev/null 2>&1 || true
          for i in 1 2 3 4 5; do
            hdiutil detach "/Volumes/Wolium" -force >/dev/null 2>&1 || true
            if hdiutil create -volname Wolium -srcfolder dmg -ov -format UDZO Wolium-macos.dmg; then
              break
            fi
            echo "hdiutil failed (attempt $i/5), retrying..."
            [ "$i" -eq 5 ] && exit 1
            sleep 5
          done
      - uses: actions/upload-artifact@v6
        with:
          name: wolium-macos
          path: |
            Wolium-macos.zip
            Wolium-macos.dmg
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Wolium-macos.zip
            Wolium-macos.dmg

  windows-store:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - run: python tools/lang.py sync
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: native
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ($v -notmatch '^\d') { $v = '0.18.0' }
          $v = "$v.${{ github.run_number }}"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTW_STORE_BUILD=ON "-DTW_VERSION=$v"
          cmake --build build --config Release --target trackwolium_guard trackwolium_core
      - name: ui
        working-directory: ui
        run: |
          flutter create --platforms=windows --project-name wolium .
          python tool\patch_windows.py . ..\assets\icon\wolium.ico
          flutter pub get
          flutter build windows --release --dart-define=STORE_BUILD=true
      - name: package
        shell: pwsh
        env:
          MSIX_IDENTITY: ${{ vars.MSIX_IDENTITY }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          pip install pillow
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item -Recurse ui\build\windows\x64\runner\Release\* stage\
          Copy-Item build\bin\Release\trackwolium.exe stage\
          Copy-Item build\bin\Release\trackwolium-core.exe stage\
          New-Item -ItemType Directory -Force stage\extensions | Out-Null
          Copy-Item -Recurse extensions\wolium-browser stage\extensions\
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ($v -notmatch '^\d') { $v = '0.18.0' }
          $parts = $v.Split('.')
          while ($parts.Count -lt 2) { $parts += '0' }
          $msixVersion = "$($parts[0]).$($parts[1]).${{ github.run_number }}.0"
          $identity = if ($env:MSIX_IDENTITY) { $env:MSIX_IDENTITY } else { 'DTSys.Wolium' }
          $publisher = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { 'CN=DTSys' }
          python tools\msix\make_msix.py stage $msixVersion $identity $publisher Wolium.msix
      - uses: actions/upload-artifact@v6
        with:
          name: wolium-msix
          path: Wolium.msix
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Wolium.msix

  android-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 tools/lang.py sync
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: signing and version
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$v" in
            [0-9]*) VER="$v.${GITHUB_RUN_NUMBER}" ;;
            *) VER="0.18.0.${GITHUB_RUN_NUMBER}" ;;
          esac
          echo "WOLIUM_VERSION=$VER" >> "$GITHUB_ENV"
          echo "WOLIUM_BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/wolium.jks"
            echo "WOLIUM_KEYSTORE=$RUNNER_TEMP/wolium.jks" >> "$GITHUB_ENV"
            echo "WOLIUM_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "WOLIUM_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          fi
      - name: build
        working-directory: ui
        env:
          STORE_BUILD: "true"
        run: |
          pip install pillow
          flutter create --platforms=android --org io.github.arturwo1 --project-name wolium .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py . assets/icon/wolium_256.png
          flutter pub get
          flutter build appbundle --release --dart-define=WOLIUM_VERSION=$WOLIUM_VERSION --dart-define=STORE_BUILD=true
          cp build/app/outputs/bundle/release/app-release.aab ../Wolium.aab
      - uses: actions/upload-artifact@v6
        with:
          name: wolium-aab
          path: Wolium.aab
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Wolium.aab

  provenance:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, android, macos, windows-store, android-store]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: download assets
        run: |
          mkdir dist
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir dist --pattern WoliumSetup.exe --pattern Wolium.apk --pattern Wolium-linux-x86_64.tar.gz --pattern Wolium-macos.dmg --pattern Wolium-macos.zip --pattern Wolium.msix --pattern Wolium.aab
      - name: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$v" in
            [0-9]*) ;;
            *) v=0.18.0 ;;
          esac
          printf '%s' "$v.${{ github.run_number }}" > version.txt
          cat version.txt
      - name: checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/WoliumSetup.exe
            dist/Wolium.apk
            dist/Wolium-linux-x86_64.tar.gz
            dist/Wolium-macos.dmg
            dist/Wolium-macos.zip
            dist/Wolium.msix
            dist/Wolium.aab
      - name: publish checksums and version
        run: gh release upload "${{ github.ref_name }}" dist/SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
      - name: publish version last
        run: gh release upload "${{ github.ref_name }}" version.txt --repo "${{ github.repository }}" --clobber
      - name: notify
        if: env.NTFY_TOPIC != ''
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: |
          curl -fsS -H "Title: Wolium $(cat version.txt)" -H "Tags: arrow_up" -H "Click: https://github.com/${{ github.repository }}/releases/latest" -d "Update is ready" "https://ntfy.sh/$NTFY_TOPIC" || true
