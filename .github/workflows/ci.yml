name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python tools/lang.py sync
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: smoke run (linux)
        if: runner.os == 'Linux'
        run: ./build/bin/trackwolium-console --for 3 --no-color --standalone --db build/ci.db
      - name: smoke run (windows)
        if: runner.os == 'Windows'
        run: .\build\bin\Release\trackwolium-console.exe --for 3 --no-color --standalone --db build\ci.db

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/lang.py sync
      - run: >
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-26
          -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-android
