name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python tools/lang.py sync
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: smoke run (linux)
        if: runner.os == 'Linux'
        run: ./build/bin/trackwolium-console --for 3 --no-color --standalone --db build/ci.db
      - name: smoke run (windows)
        if: runner.os == 'Windows'
        run: .\build\bin\Release\trackwolium-console.exe --for 3 --no-color --standalone --db build\ci.db

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/lang.py sync
      - run: >
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-26
          -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-android

  linux-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/lang.py sync
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev xvfb openbox xdotool x11-apps
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: sh tests/e2e_linux.sh build/bin/trackwolium-core

  ui-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/lang.py sync
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb imagemagick libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: build
        working-directory: ui
        run: |
          flutter create --platforms=linux --project-name wolium .
          rm -f test/widget_test.dart
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build linux --release --dart-define=WOLIUM_VERSION=0.0.0.${GITHUB_RUN_NUMBER}
      - name: screenshot
        run: |
          mkdir -p "$HOME/.local/share/DTSys/Wolium"
          touch "$HOME/.local/share/DTSys/Wolium/consent"
          xvfb-run -a -s "-screen 0 1280x800x24" sh -c 'ui/build/linux/x64/release/bundle/wolium & pid=$!; sleep 12; import -window root shot.png; kill $pid || true'
      - uses: actions/upload-artifact@v4
        with:
          name: ui-linux-screenshot
          path: shot.png

  ui-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/lang.py sync
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: signing and version
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          VER=0.0.0.${GITHUB_RUN_NUMBER}
          echo "WOLIUM_VERSION=$VER" >> "$GITHUB_ENV"
          echo "WOLIUM_BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/wolium.jks"
            echo "WOLIUM_KEYSTORE=$RUNNER_TEMP/wolium.jks" >> "$GITHUB_ENV"
            echo "WOLIUM_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "WOLIUM_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          fi
      - name: test and build
        working-directory: ui
        run: |
          pip install pillow
          flutter create --platforms=android --org io.github.arturwo1 --project-name wolium .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py . assets/icon/wolium_256.png
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build apk --release --dart-define=WOLIUM_VERSION=$WOLIUM_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: wolium-apk
          path: ui/build/app/outputs/flutter-apk/app-release.apk
